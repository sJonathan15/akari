# Pruebas del servicio en Linux y en Windows de verdad, y compilación de la app:
#   * en cada push (cualquier rama) y pull request: pruebas (y en Windows, la lectura real de PnP y la batería);
#   * en main y en la rama de trabajo: la app de Windows (Tauri), instalada y medida;
#   * con una etiqueta v* (p. ej. v0.2.0): AppImage x86_64 + arm64 e instalador de Windows,
#     publicados en Releases (install.sh e install.ps1 bajan de ahí la última versión).
name: compilar

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: dbus-daemon (para probar el cliente D-Bus propio)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends dbus
      - name: Pruebas del servicio
        run: python -m unittest discover -v -s pruebas/servicio -p "prueba_*.py"
      - name: Lo que ve akari en este equipo
        run: |
          python bin/akari.py escritorio
          python bin/akari.py guia

  appimage:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx electron-builder --linux AppImage --x64 --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: app/dist/*.AppImage

  # La app de Windows (Tauri + WebView2, escritorio/): se compila en cada push de main o de la
  # rama de trabajo, se instala en silencio, se mide y falla si no cumple las metas.
  escritorio:
    name: Windows (Tauri)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/akari-windows-ligero' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    env:
      LIMITE_INSTALADOR_MB: 40
      LIMITE_RAM_MB: 150
      LIMITE_CPU_PCT: 1
    defaults:
      run:
        shell: pwsh
        working-directory: escritorio
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: escritorio
      - name: Pruebas de la geometría (Rust)
        run: cargo test --quiet
      - name: Python embebido (recortado)
        run: ./scripts/python.ps1
      - name: Compilar el instalador
        run: npx --yes @tauri-apps/cli@2.12.1 build --bundles nsis --ci
      - name: Instalador
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist/akari-setup-x64.exe
          '{0:N1} MB' -f ($exe.Length / 1MB)
      - name: Instalar en silencio (por usuario, sin admin)
        run: |
          Start-Process -Wait dist/akari-setup-x64.exe -ArgumentList '/S'
          $dir = "$env:LOCALAPPDATA\Programs\akari"
          if (-not (Test-Path "$dir\akari.exe")) {
            Get-ChildItem $env:LOCALAPPDATA -Filter akari.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue | ForEach-Object FullName
            throw "akari.exe no quedó en $dir"
          }
          '{0:N1} MB instalados' -f ((Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
      - name: Medir (30 s en reposo, luego el ratón sobre una burbuja)
        run: ./scripts/medir.ps1 -Exe "$env:LOCALAPPDATA\Programs\akari\akari.exe" -Espera 30 -Ventana 20 -Raton -TrasUso 75 -Salida medicion.json -Captura captura.png
      - name: El servicio de la app
        run: |
          $b = Invoke-RestMethod http://127.0.0.1:47830/api/burbujas
          "$($b.grupos.Count) grupos: $(($b.grupos | ForEach-Object { "$($_.id) [$(($_.piezas | ForEach-Object id) -join "/")]" }) -join ", ") · reposo: $($b.reposo)"
          if ($b.grupos.Count -ne 3) { throw "se esperaban los tres grupos de AGENTS.md" }
      - name: Cerrar la app de golpe cierra también el servicio
        run: |
          $m = Get-Content medicion.json | ConvertFrom-Json
          Stop-Process -Id $m.pid -Force
          Start-Sleep -Seconds 3
          $quedan = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*Programs\akari*' })
          $quedan | ForEach-Object { "$($_.Name) $($_.CommandLine)" }
          if ($quedan.Count) { throw "quedaron $($quedan.Count) procesos de akari" }
      - name: Desinstalar limpio
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\akari"
          Get-Process akari -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3      # que terminen también los procesos de WebView2
          Start-Process -Wait "$dir\uninstall.exe" -ArgumentList '/S'
          # el desinstalador de NSIS se copia a %TEMP% y sigue desde ahí: se espera a que termine
          foreach ($i in 1..40) { if (-not (Test-Path $dir)) { break }; Start-Sleep -Seconds 1 }
          $restos = @(Get-ChildItem $dir -Recurse -ErrorAction SilentlyContinue | ForEach-Object FullName)
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name akari -ErrorAction SilentlyContinue
          $cache = Test-Path "$env:LOCALAPPDATA\io.github.sjonathan15.akari"
          "restos: $($restos.Count) · inicio con Windows: $([bool]$run) · caché WebView2: $cache"
          $restos
          if ($restos.Count -or $run -or $cache) { throw 'la desinstalación dejó cosas' }
      - name: Metas
        if: always()
        run: |
          $m = Get-Content medicion.json | ConvertFrom-Json
          $mb = [math]::Round((Get-Item dist/akari-setup-x64.exe).Length / 1MB, 1)
          function Fila($medida, $valor, $meta, $ok) { [pscustomobject]@{ Medida = $medida; Valor = $valor; Meta = $meta; Ok = [bool]$ok } }
          $filas = @(
            (Fila 'Instalador' "$mb MB" "≤ $env:LIMITE_INSTALADOR_MB MB" ($mb -le [double]$env:LIMITE_INSTALADOR_MB))
            (Fila 'RAM en reposo (Working Set, todos los procesos)' "$($m.ram_ws_mb) MB" "≤ $env:LIMITE_RAM_MB MB" ($m.ram_ws_mb -le [double]$env:LIMITE_RAM_MB))
            (Fila 'RAM privada (informativo)' "$($m.ram_privada_mb) MB" '—' $true)
            (Fila 'RAM 75 s después de abrir y cerrar una burbuja (informativo)' "$($m.ram_tras_uso_mb) MB" '—' $true)
            (Fila 'Primera apertura (crea WebView2, informativo)' "$($m.raton.abre_en_ms) ms" '—' $true)
            (Fila 'CPU en reposo' "$($m.cpu_reposo_pct) %" "≤ $env:LIMITE_CPU_PCT %" ($m.cpu_reposo_pct -le [double]$env:LIMITE_CPU_PCT))
            (Fila 'Burbujas en pantalla' "$($m.ventanas.Count)" '≥ 3' ($m.ventanas.Count -ge 3))
            (Fila 'Se abre al pasar el ratón y se cierra al salir' "$($m.raton.se_abrio) / $($m.raton.se_cerro)" 'True / True' ($m.raton.se_abrio -and $m.raton.se_cerro))
          )
          $tabla = "| Medida | Valor | Meta | |`n|---|---|---|---|`n" + (($filas | ForEach-Object { "| $($_.Medida) | $($_.Valor) | $($_.Meta) | $(if ($_.Ok) { '✅' } else { '❌' }) |" }) -join "`n")
          $procesos = ($m.detalle | ForEach-Object { "$($_.proceso) ×$($_.cuantos): $($_.ws_mb) MB" }) -join ' · '
          "## akari para Windows (Tauri)`n`n$tabla`n`nProcesos: $procesos" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($filas | Where-Object { -not $_.Ok }) { throw 'no se cumplen las metas' }
      - name: Captura para el registro
        if: always()
        run: |
          if (-not (Test-Path captura.png)) { return }
          Add-Type -AssemblyName System.Drawing
          $img = [System.Drawing.Image]::FromFile((Resolve-Path captura.png))
          $chica = New-Object System.Drawing.Bitmap $img, 768, 492
          $ms = New-Object IO.MemoryStream
          $chica.Save($ms, [System.Drawing.Imaging.ImageFormat]::Jpeg)
          "CAPTURA-INICIO"; [Convert]::ToBase64String($ms.ToArray()); "CAPTURA-FIN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows
          path: escritorio/dist/akari-setup-x64.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-medicion
          path: |
            escritorio/*.json
            escritorio/captura.png

  # La app Electron en Windows, solo para comparar ("antes"): con workflow_dispatch o con
  # [medir-antes] en el mensaje del commit.
  electron-windows:
    name: Windows (Electron, para comparar)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[medir-antes]')
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/python-windows.ps1
        working-directory: app
      - run: npx electron-builder --win nsis --x64 --publish never
        working-directory: app
      - name: Instalar y medir
        run: |
          $setup = Get-ChildItem app/dist/akari-setup-*.exe | Select-Object -First 1
          Start-Process -Wait $setup.FullName -ArgumentList '/S'
          ./escritorio/scripts/medir.ps1 -Exe "$env:LOCALAPPDATA\Programs\akari\akari.exe" -Espera 30 -Ventana 20 -Raton -Nombre electron -Salida electron.json | Out-Null
          $m = Get-Content electron.json | ConvertFrom-Json
          $mb = [math]::Round($setup.Length / 1MB, 1)
          "## akari para Windows (Electron, antes)`n`n| Instalador | RAM (Working Set) | RAM privada | CPU en reposo | abre / cierra |`n|---|---|---|---|---|`n| $mb MB | $($m.ram_ws_mb) MB | $($m.ram_privada_mb) MB | $($m.cpu_reposo_pct) % | $($m.raton.se_abrio) / $($m.raton.se_cerro) |`n`nProcesos: $(($m.detalle | ForEach-Object { "$($_.proceso) ×$($_.cuantos): $($_.ws_mb) MB" }) -join ' · ')" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: electron-medicion
          path: electron.json

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, escritorio]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/akari-setup-x64.exe
          generate_release_notes: true
