[package]
name = "akari-escritorio"
version = "0.1.0"
description = "akari: burbujas flotantes de escritorio (Windows, WebView2)"
authors = ["sJonathan15"]
license = "MIT"
repository = "https://github.com/sJonathan15/akari"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "akari"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# cabeceras nativas de las burbujas cerradas (Rust puro, sin navegador)
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }
ab_glyph = "=0.2.32"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell"] }
webview2-com = "=0.39.1"
windows = "=0.62.2"

[dev-dependencies]
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "png-format"] }

[profile.release]
# lo que pesa poco: optimizar por tamaño, sin símbolos ni pánicos con desenrollado
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
