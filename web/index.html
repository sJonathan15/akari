<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>akari</title>
  <link rel="icon" href="icono.png">
  <link rel="stylesheet" href="estilo.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <!-- vista "burbuja": uno de los tres grupos flotantes de la app (Windows, X11, GNOME…), igual que
       las cápsulas de Quickshell: un chip por pieza en la cabecera y, abierta, la sección del panel
       de la pieza elegida en su cuerpo (los grupos y sus piezas vienen de GET /api/burbujas) -->
  <div id="burbuja" class="burbuja" hidden>
    <div class="forma" id="b-forma">
      <div class="b-cabecera" id="b-cabecera"><div class="b-fila" id="b-fila"></div></div>
      <div class="b-cuerpo" id="b-cuerpo">
        <div class="b-contenido" id="b-contenido">
          <button class="mas b-panel" id="b-panel" type="button"><span class="icono">open_in_new</span><span data-t="Abrir panel completo|Open full panel"></span></button>
        </div>
      </div>
    </div>
  </div>

  <main id="panel" class="panel" hidden>
    <header class="cabecera">
      <div class="marca"><img class="logo" src="icono.png" alt=""><span>akari</span></div>
      <nav class="pestanas" id="pestanas">
        <button data-g="equipo"><span class="icono">devices</span><span data-t="Equipo|Computer"></span></button>
        <button data-g="ia" class="activa"><span class="icono">bolt</span><span data-t="IA|AI"></span></button>
        <button data-g="archivos"><span class="icono">folder_copy</span><span data-t="Archivos|Files"></span></button>
      </nav>
      <span class="estado-servicio" id="servicio" title=""></span>
    </header>
    <!-- las piezas del grupo elegido -->
    <nav class="sub-pestanas piezas" id="piezas"></nav>

    <!-- IA · Uso de IA -->
    <section id="p-ia" class="pagina activa">
      <div class="sub-pestanas" id="proveedores"></div>
      <div id="sin-ia" class="tarjeta aviso" hidden data-t="No encontré Claude Code ni Codex en este equipo. Cuando los instales e inicies sesión, aquí verás tus límites y tokens.|Neither Claude Code nor Codex was found. Once you install one and sign in, your limits and tokens show up here."></div>
      <div id="ia-contenido">
        <div class="tarjeta limites" id="limites"></div>
        <div class="tarjeta" id="activador"></div>
        <div class="fila-tarjetas">
          <div class="tarjeta" id="modelo"></div>
          <div class="tarjeta" id="tokens"></div>
        </div>
        <div class="tarjeta" id="semana"></div>
        <div class="tarjeta" id="sesiones"></div>
      </div>
    </section>

    <!-- IA · Modelos de IA -->
    <section id="p-modelos" class="pagina">
      <div class="tarjeta modelos" id="modelos-ia"></div>
    </section>

    <!-- Equipo · Dispositivos -->
    <section id="p-disp" class="pagina">
      <div class="tarjeta escenario">
        <canvas id="visor"></canvas>
        <div class="escenario-texto"><small id="d-tipo"></small><strong id="d-nombre"></strong></div>
        <div class="chip" id="d-chip"></div>
        <div class="anillo-bateria" id="d-anillo"></div>
      </div>
      <div class="tarjeta lista" id="d-lista"></div>
      <div class="tarjeta" id="d-detalles"></div>
      <div class="pie" id="d-pie"></div>
    </section>

    <!-- IA · Habilidades -->
    <section id="p-hab" class="pagina">
      <div class="sub-pestanas" id="hab-pestanas">
        <button data-h="recomendadas" class="activa" data-t="Recomendadas|Recommended"></button>
        <button data-h="instaladas" data-t="Instaladas|Installed"></button>
        <button data-h="mcp">MCP</button>
      </div>
      <div id="hab-contenido"></div>
    </section>

    <!-- IA · Herramientas -->
    <section id="p-herr" class="pagina">
      <div id="herr-contenido"></div>
    </section>

    <!-- Archivos · Documentos -->
    <section id="p-doc" class="pagina">
      <div id="doc-contenido"></div>
    </section>

    <!-- Archivos · Audio -->
    <section id="p-audio" class="pagina">
      <div id="audio-contenido" class="doc-columna"></div>
    </section>

    <!-- Archivos · Cerebro: el buscador queda fijo (no se redibuja mientras se escribe) -->
    <section id="p-cerebro" class="pagina">
      <div id="cer-contenido" class="doc-columna"></div>
      <div id="cer-buscador" class="doc-columna" hidden>
        <form class="campo cer-campo" id="cer-form"><span class="icono">search</span>
          <input id="cer-q" autocomplete="off" spellcheck="false" data-t-ph="¿Dónde está…? (p. ej. informe de la tesis)|Where is…? (e.g. thesis report)">
          <button class="boton" type="button" id="cer-preguntar" data-t="Preguntar|Ask"></button></form>
        <div id="cer-resultados"></div>
      </div>
      <div id="cer-memoria" class="doc-columna"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
